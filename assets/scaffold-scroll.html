<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Canvas — Scroll Cinematic</title>
<style>
/* scaffold-master.html의 :root 변수 + class 가져옴 */
/* 실 사용시 master의 <style> 블록 통째 복붙 */

/* a11y :focus-visible — 키보드 포커스 전용 outline */
body {
  word-break: keep-all;
  line-break: strict;
  overflow-wrap: break-word;
}
:focus-visible {
  outline: 2px solid #0066CC;
  outline-offset: 2px;
  border-radius: 4px;
}
@media (max-width: 734px) {
  .grid-12 { display: block; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="ai-gradient" gradientUnits="userSpaceOnUse">
<stop offset=".09" stop-color="#fd9700"/><stop offset=".28" stop-color="#f40"/>
<stop offset=".49" stop-color="#ff2469"/><stop offset=".78" stop-color="#c65cff"/>
<stop offset="1" stop-color="#0092ff"/>
</linearGradient></defs></svg>

<main>
<!-- Section 1 — Welcome -->
<section class="section-welcome" aria-labelledby="hero-1">
  <div class="grid-12">
    <div class="large-10 large-offset-1" style="text-align:center">
      <p class="typography-eyebrow">2026 매니페스토</p>
      <h1 id="hero-1" class="typography-hero-super">
        만들지 말고,<br><span class="gradient-text">발현시켜라.</span>
      </h1>
    </div>
  </div>
</section>

<!-- Section 2 — Sticky Chip Hero (focus-expression) -->
<section class="sticky-container" style="height:600vh">
  <div class="sticky-content">
    <div class="grid-12">
      <div class="large-10 large-offset-1">
        <p class="typography-eyebrow">엔진</p>
        <p class="typography-hero-super">M5. M5 Pro. M5 Max.</p>
        <p class="typography-callout" style="margin-top:24px">M1 시리즈 대비 최대 8배 더 빠른 AI 성능</p>
      </div>
    </div>
  </div>
</section>

<!-- Section 3 — Big Number stack -->
<section aria-labelledby="num-1">
  <div class="grid-12">
    <div class="large-12" style="text-align:center;margin-bottom:80px">
      <p class="typography-eyebrow">스펙</p>
      <h2 id="num-1" class="typography-section-large">숫자가 증명.</h2>
    </div>
    <div class="large-4" style="text-align:center">
      <p class="big-number">1000<span class="unit">니트</span></p>
      <p class="typography-body" style="opacity:.7">full screen brightness</p>
    </div>
    <div class="large-4" style="text-align:center">
      <p class="big-number" style="color:var(--accent-yellow)">2,000,000:1</p>
      <p class="typography-body" style="opacity:.7">contrast ratio</p>
    </div>
    <div class="large-4" style="text-align:center">
      <p class="big-number" style="color:var(--accent-green)">120<span class="unit">Hz</span></p>
      <p class="typography-body" style="opacity:.7">ProMotion</p>
    </div>
  </div>
</section>

<!-- Section 4 — 형광펜 강조 -->
<section>
  <div class="grid-12">
    <div class="large-10 large-offset-1">
      <p class="typography-eyebrow">하이라이트</p>
      <h2 class="typography-section-large">
        <span class="hl hl-pink hl-block">속도.</span>
        <span class="hl hl-green hl-block">정확도.</span>
        <span class="hl hl-yellow hl-block">개인정보 보호.</span>
        세 가지 모두.
      </h2>
    </div>
  </div>
</section>

<!-- Section 5 (마지막) — Light alt -->
<section data-theme="light" style="background:#F5F5F7;color:#1D1D1F">
  <div class="grid-12">
    <div class="large-10 large-offset-1" style="text-align:center">
      <p class="typography-eyebrow">다음 행동</p>
      <h2 class="typography-section">지금 시작하세요.</h2>
      <a href="#" class="btn" style="margin-top:32px">시작하기</a>
    </div>
  </div>
</section>
</main>
</body>
</html>
