<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Canvas — Bento</title>
<link rel="stylesheet" href="data:text/css;base64,">
<style>
/* scaffold-master.html의 :root + 16-scale + .grid-12 + .bento-cell + 형광펜 + gradient-text 가져옴 */
/* 이 scaffold는 master에 콘텐츠만 추가한 변형. 실 사용시 master의 style 블록 그대로 복붙 */
</style>
</head>
<body>

<!-- AI gradient SVG def -->
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="ai-gradient" gradientUnits="userSpaceOnUse">
<stop offset=".09" stop-color="#fd9700"/><stop offset=".28" stop-color="#f40"/>
<stop offset=".49" stop-color="#ff2469"/><stop offset=".78" stop-color="#c65cff"/>
<stop offset="1" stop-color="#0092ff"/>
</linearGradient></defs></svg>

<main>
<section aria-labelledby="bento-hero">
<div class="bento-grid grid-12" style="grid-auto-rows: minmax(240px, auto); gap: 16px;">

  <!-- Hero 셀 -->
  <div class="bento-cell tone-dark large-8" id="bento-hero">
    <p class="typography-eyebrow">2026 Q4 KPI</p>
    <h1 class="typography-hero">
      전년 대비 <span class="gradient-text">6.7배.</span>
    </h1>
    <p class="typography-callout" style="margin-top:24px;opacity:.8">압도적 성장. 검증된 모델.</p>
  </div>

  <!-- Big Number 셀 -->
  <div class="bento-cell tone-bordered large-4" aria-label="매출">
    <p class="typography-eyebrow">매출</p>
    <p class="big-number">1000<span class="unit">억</span></p>
  </div>

  <!-- 컬러 셀 (vivid) -->
  <div class="bento-cell tone-colored-pink large-4" aria-label="신규고객">
    <p class="typography-eyebrow" style="color:white;opacity:.85">신규고객</p>
    <p class="big-number" style="color:white">3.7<span class="unit">배</span></p>
  </div>

  <!-- 형광펜 셀 -->
  <div class="bento-cell tone-dark large-8">
    <p class="typography-eyebrow">하이라이트</p>
    <h2 class="typography-section">
      <span class="highlight-wrapper highlight-pink">압도적</span> 성장.
      <span class="highlight-wrapper highlight-mint">검증된</span> 수익 모델.
      <span class="highlight-wrapper highlight-yellow">다음 단계</span>로.
    </h2>
  </div>

  <!-- 가로 차트 셀 -->
  <div class="bento-cell tone-bordered large-12">
    <p class="typography-eyebrow">월별 추이</p>
    <h3 class="typography-headline">12개월 연속 상승.</h3>
    <!-- 차트 placeholder -->
    <div style="height:120px;background:var(--ai-gradient);border-radius:12px;margin-top:24px;opacity:.85"></div>
  </div>

</div>
</section>
</main>
</body>
</html>
